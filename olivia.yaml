      - [ 0xFF, 0x20, 0x10, 0x00]
      - [ 0x35, 0x00]
      - [ 0xFF, 0x20, 0x10, 0x12]
      - [ 0x21, 0x70]
      - [ 0xFF, 0x20, 0x10, 0x2D]
      - [ 0x02, 0x00]
      - [ 0xFF, 0x20, 0x10, 0x00]
      - [ 0x11 ]      
      - delay 120ms
      - [ 0x29 ]
      - delay 20ms

# LVGL (full_refresh tear-free; percentage centering reliable)
lvgl:
  log_level: WARN
  full_refresh: false
  touchscreens:
    - touchscreen_id: olivia_touch  
  pages:
    - id: page_test
      bg_color: 0x000000
      bg_opa: 100%
      widgets:
        - label:
            x: 0%
            y: 160  # Upper (adjust ±15% post-MADCTL if needed)
            width: 100%
            align: TOP_MID
            text_align: center
            text: "Hello Olivia!"
            text_color: 0xFFFFFF
            text_opa: 100%
            text_font: montserrat_36
        - label:
            x: 0%
            y: 200
            width: 100%
            align: TOP_MID
            text_align: center
            text: "How was your party?"
            text_color: 0x00FF00
            text_opa: 100%
            text_font: montserrat_36
    - id: page_test2
      bg_color: 0x000000
      widgets:
        - label:
            align: CENTER
            text: "CENTRE"
            text_color: 0xFFFFFF
    - id: page_touch_test
      bg_color: 0x000000
      bg_opa: 100%
      widgets:
        - label:
            id: lbl_title
            align: TOP_MID
            y: 20
            text: "TOUCH TEST"
            text_color: 0xFFFFFF
            text_font: montserrat_36

        - label:
            id: lbl_touch
            align: TOP_MID
            y: 80
            text: "Touch: 0, 0"
            text_color: 0x00FF00
            text_font: montserrat_24

        - label:
            id: lbl_event
            align: TOP_MID
            y: 115
            text: "Event: (none)"
            text_color: 0xFFFFFF
            text_font: montserrat_24

        - button:
            id: btn_big
            align: CENTER
            width: 300
            height: 140
            radius: 24
            text: "OFF"
            text_color: 0xFFFFFF
            text_font: montserrat_48
            text_align: CENTER
            bg_color: 0x202020
            pressed:
              bg_color: 0x404040
            on_all_events:
              then:
                - logger.log: "BTN event fired"
            on_press:
              then:
                - lvgl.label.update:
                    id: lbl_event
                    text: "Event: BUTTON PRESS"

            on_release:
              then:
                - lambda: |-
                    id(btn_state) = !id(btn_state);
                - lvgl.button.update:
                    id: btn_big
                    text: !lambda |-
                      return id(btn_state) ? std::string("ON") : std::string("OFF");
                - lvgl.label.update:
                    id: lbl_event
                    text: "Event: BUTTON RELEASE"
        #- obj:
        #    id: touch_dot
        #    width: 18
        #    height: 18
        #    radius: 9
        #    bg_color: 0xFF0000
        #    bg_opa: 100%
        #    x: 0
        #    y: 0
    - id: page_touch_test2
      bg_color: 0x000000
      bg_opa: 100%
      widgets:
        - button:
            id: btn_big2
            align: CENTER
            width: 300
            height: 140
            radius: 24
            text: "OFF"
            text_color: 0xFFFFFF
            text_font: montserrat_48
            bg_color: 0x202020
            on_all_events:
              then:
                - lambda: |-
                    lv_event_code_t code = lv_event_get_code(event);

                    const char *name = "OTHER";
                    if (code == LV_EVENT_PRESSED) name = "PRESSED";
                    else if (code == LV_EVENT_PRESSING) name = "PRESSING";
                    else if (code == LV_EVENT_RELEASED) name = "RELEASED";
                    else if (code == LV_EVENT_CLICKED) name = "CLICKED";
                    else if (code == LV_EVENT_SHORT_CLICKED) name = "SHORT_CLICKED";
                    else if (code == LV_EVENT_LONG_PRESSED) name = "LONG_PRESSED";
                    else if (code == LV_EVENT_LONG_PRESSED_REPEAT) name = "LONG_REPEAT";
                    else return;  // ignore everything else

                    ESP_LOGI("LVGL", "BTN %s (%d)", name, (int) code);


