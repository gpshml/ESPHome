substitutions:
  code_ver: "623ac9eea22cef174173ab05d8ff5fe090ec6806"

globals:
  - id: touch_x
    type: int
    initial_value: '0'
  - id: touch_y
    type: int
    initial_value: '0'
  - id: btn_state
    type: bool
    initial_value: 'false'

esphome:
  name: olivia
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    - priority: -200
      then:
        - delay: 50ms
        - lvgl.page.show: page_touch_test2
    - priority: 800
      then:
        - delay: 2s
        - lambda: |-
            ESP_LOGI("boot", "TP reset pulse starting");
        - lambda: |-
            id(pca9554a_device).digital_write(1, false);  // TP_RST low (EXIO1)
        - delay: 50ms
        - lambda: |-
            id(pca9554a_device).digital_write(1, true);   // TP_RST high
        - delay: 50ms
        - lambda: |-
            ESP_LOGI("boot", "TP reset pulse done");
        - lambda: |-
            id(olivia_touch).notify_display_ready();
        - logger.log: "Notified display_ready to touch"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable Home Assistant API
api:
  encryption:
    key: "kWYVKnlTS+yJ6hUrn/6h9pUOqFEgz8KTJVNwR0JkBXU="

ota:
  - platform: esphome
    password: "04cca415fc16042d4f16d11917852029"
    
logger:
  level: INFO  # Detailed boot logs
  logs:
    spd2010_touch: INFO
    touchscreen: WARN
    i2c.idf: WARN

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5

psram:
  mode: octal
  speed: 80MHz

i2s_audio:
  - id: i2s_output
    # i2s_output data pin is gpio10
    i2s_lrclk_pin:
      number: GPIO38
    i2s_bclk_pin:
      number: GPIO48

  - id: i2s_input
    # data line is GPIO15
    i2s_lrclk_pin:
      number: GPIO2
    i2s_bclk_pin:
      number: GPIO15

microphone:
  - platform: i2s_audio
    id: i2s_microphone
    i2s_audio_id: i2s_input
    i2s_din_pin: GPIO39
    adc_type: external
    pdm: false
    channel: right
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    i2s_audio_id: i2s_output
    i2s_dout_pin: GPIO47
    dac_type: external
    channel: stereo
    
i2c:
  sda: GPIO11
  scl: GPIO10
  scan: true                  # Keep for boot visibility (should now see 0x53 after reset/init)
  frequency: 100kHz
  timeout: 200ms              # Increased - SPD2010 can be slow to respond
  id: my_i2c_bus

pca9554:
  - id: 'pca9554a_device'
    address: 0x20

output:
  - platform: ledc
    pin: GPIO5
    id: backlight

light:
  - platform: monochromatic
    output: backlight
    name: "backlight Light" 
    restore_mode: ALWAYS_ON

sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 10s

script:
  - id: ui_update_touch_labels
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_touch
          text: !lambda |-
            char buf[32];
            snprintf(buf, sizeof(buf), "Touch: %d, %d", id(touch_x), id(touch_y));
            return std::string(buf);
      
      - lvgl.label.update:
          id: lbl_event
          text: "Event: TOUCH"
      
      #- lvgl.widget.update:
      #    id: touch_dot
      #    x: !lambda 'return id(touch_x) - 9;'
      #    y: !lambda 'return id(touch_y) - 9;'
  
  - id: ui_next
    then:
      - lvgl.page.next:
          animation: OUT_LEFT
          time: 200ms

  - id: ui_prev
    then:
      - lvgl.page.previous:
          animation: OUT_RIGHT
          time: 200ms
  - id: play_beep
    mode: single
    then:
      - rtttl.play:
          rtttl: "beep:d=32,o=6,b=180:16c" 

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"
    ssid:
      name: "WiFi SSID"
    mac_address:
      name: "MAC address"

button:
  - platform: template
    name: "Beep Speaker"
    on_press:
      - script.execute: play_beep  
  - platform: template
    name: "UI Next Screen"
    on_press:
      - script.execute: ui_next

  - platform: template
    name: "UI Previous Screen"
    on_press:
      - script.execute: ui_prev

rtttl:
  speaker: i2s_audio_speaker
  id: my_rtttl
  gain: 0.6

spi:
  id: display_qspi
  type: quad
  clk_pin: GPIO40
  interface: spi2
  data_pins: [GPIO46, GPIO45, GPIO42, GPIO41]

external_components:
  - source:
      type: git
      url: https://github.com/gpshml/ESPHome
      ref: "${code_ver}"
    components: [ spd2010_touch ]

touchscreen:
  - platform: spd2010_touch
    id: olivia_touch
    address: 0x53
    interrupt_pin:
      number: GPIO4
      mode: INPUT_PULLUP
    # NEW: use the expander for shared reset (pin 1)
    pca9554_id: pca9554a_device
    reset_io: 1
    polling_fallback_ms: 50
    # NO reset_pin here - display handles shared RST via PCA IO1
    calibration:
      x_min: 0
      x_max: 411
      y_min: 0
      y_max: 411
    on_touch:
      - lambda: |-
          id(touch_x) = touch.x;
          id(touch_y) = touch.y;
      - script.execute: ui_update_touch_labels

display:
  - platform: qspi_dbi
    model: CUSTOM
    data_rate: 10MHz
    id: main_display
    spi_id: display_qspi
    rotation: 0°
    color_order: rgb
    dimensions:
      height: 412
      width: 412    
    cs_pin: GPIO21
    reset_pin:
      pca9554: pca9554a_device
      number: 2
    auto_clear_enabled: false #set to false for LVGL    
    spi_mode: 0       
    draw_rounding: 4 
