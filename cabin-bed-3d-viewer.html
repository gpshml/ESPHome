<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cabin Bed — Interactive 3D</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f5f7; color: #1a1d23; font-family: system-ui, sans-serif; overflow: hidden; }
    #ui {
      position: absolute; z-index: 10; top: 12px; left: 12px; right: 12px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      pointer-events: none;
    }
    #ui > * { pointer-events: auto; }
    h1 { font-size: 15px; font-weight: 600; margin: 0; background: rgba(255,255,255,.9); padding: 8px 12px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .hint { font-size: 12px; background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 8px; color: #5a6270; }
    button {
      background: #2980b9; color: #fff; border: 0; border-radius: 8px;
      padding: 8px 12px; font-size: 13px; cursor: pointer; font-weight: 600;
    }
    button.secondary { background: #5a6270; }
    button.active { outline: 2px solid #1a1d23; outline-offset: 1px; }
    #canvas-wrap { width: 100%; height: 100%; }
    canvas { display: block; }
    #view-label {
      position: absolute; bottom: 14px; left: 14px; z-index: 10;
      background: rgba(255,255,255,.92); padding: 8px 12px; border-radius: 8px;
      font-size: 13px; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }
    #err {
      display: none; position: absolute; inset: 20% 10%; z-index: 20;
      background: #fff3cd; border: 1px solid #ffc107; border-radius: 10px;
      padding: 20px; font-size: 14px; line-height: 1.5;
    }
  </style>
  <!-- CDN import map: works with htmlpreview / single-file open (needs network) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="ui">
    <h1>Cabin bed — 3D source model</h1>
    <span class="hint">Left-drag: rotate · Scroll: zoom · Right-drag: pan</span>
    <button type="button" class="secondary" data-view="3d">3D</button>
    <button type="button" class="secondary" data-view="front">Front</button>
    <button type="button" class="secondary" data-view="top">Top</button>
    <button type="button" class="secondary" data-view="side">Side (foot)</button>
    <button type="button" id="reset">Reset</button>
    <button type="button" class="secondary" id="toggleFront">Toggle front wall</button>
  </div>
  <div id="view-label">View: 3D</div>
  <div id="err"></div>
  <div id="canvas-wrap"></div>

  <script type="module">
    const errEl = document.getElementById("err");
    function showError(msg) {
      errEl.style.display = "block";
      errEl.innerHTML = "<strong>Could not load 3D viewer</strong><br>" + msg +
        "<br><br>Needs network access for Three.js (unpkg). Or serve the repo locally:<br><code>python3 -m http.server 8765</code>";
      console.error(msg);
    }

    let THREE, OrbitControls;
    try {
      THREE = await import("three");
      ({ OrbitControls } = await import("three/addons/controls/OrbitControls.js"));
    } catch (e) {
      showError(String(e && e.message ? e.message : e));
      throw e;
    }

    // —— Geometry (inline so this file is self-contained) ——
    const DIM = {
      FOOT: 98, INTERNAL_W: 2246, W: 2344, D: 1242, EXT: 237, H: 2380,
      REAR: 210, HEAD_W: 326, SHELF: 1200,
      PLINTH: 173, FRAME_H: 357, PLATFORM: 530,
      MATT_W: 1900, MATT_D: 900, MATT_H: 220, TOL: 10, FRAME_D: 920,
      ACCESS_W: 1300, ACCESS_X: 398, ACCESS_BOT: 640, ACCESS_TOP: 2080,
      get FRONT_Y() { return this.D - this.FOOT; },
      S: 0.001,
    };

    function buildCabinBed() {
      const {
        FOOT, INTERNAL_W, W, D, EXT, H, REAR, HEAD_W, SHELF,
        PLINTH, FRAME_H, PLATFORM, MATT_W, MATT_D, MATT_H, TOL, FRAME_D,
        ACCESS_W, ACCESS_X, ACCESS_BOT, ACCESS_TOP, S,
      } = DIM;
      const FRONT_Y = DIM.FRONT_Y;
      const root = new THREE.Group();
      const frontGroup = new THREE.Group();
      const footGroup = new THREE.Group();
      root.add(frontGroup);
      root.add(footGroup);

      function box(parent, x, y, z, w, d, h, color, opacity = 1, renderOrder = 0) {
        const geo = new THREE.BoxGeometry(w * S, h * S, d * S);
        const mat = new THREE.MeshStandardMaterial({
          color, transparent: opacity < 1, opacity,
          depthWrite: opacity >= 0.9, metalness: 0.05, roughness: 0.75,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set((x + w / 2) * S, (z + h / 2) * S, (y + d / 2) * S);
        mesh.renderOrder = renderOrder;
        mesh.add(new THREE.LineSegments(
          new THREE.EdgesGeometry(geo),
          new THREE.LineBasicMaterial({ color: 0x222222, transparent: true, opacity: 0.4 })
        ));
        parent.add(mesh);
        return mesh;
      }

      // Foot wall (existing + front extension) — no overlap with each other
      box(footGroup, 0, 0, 0, FOOT, D - EXT, H, 0xe67e22, 0.92);
      box(footGroup, 0, D - EXT, 0, FOOT, EXT, H, 0xf1c40f, 0.95);

      // Rear shelf — stops before head wall (no shared volume at back-right)
      const shelfW = INTERNAL_W - HEAD_W;
      box(root, FOOT, 0, 0, shelfW, REAR, SHELF, 0xd4b896, 0.85);

      // Head fascia — from back wall along bed depth; stops short of front (FRONT_Y = 1144)
      const headDepth = REAR + FRAME_D; // 1130mm
      box(root, W - HEAD_W, 0, 0, HEAD_W, headDepth, SHELF, 0xbdc3c7, 0.8);

      // Bed stack — behind front wall; frame Y = REAR → REAR+FRAME_D
      const mx = FOOT + TOL, fy = REAR, my = REAR + TOL;
      box(root, mx, fy, 0, MATT_W, FRAME_D, PLINTH, 0xc4a574, 0.95);
      box(root, mx, fy, PLINTH, MATT_W, FRAME_D, FRAME_H, 0x8B4513, 0.95);
      box(root, mx, my, PLATFORM, MATT_W, MATT_D, MATT_H, 0x2ecc71, 0.98);

      // Front fascia as non-overlapping picture-frame (sill / jambs / lintel)
      const leftW = ACCESS_X - FOOT;
      const rightX = ACCESS_X + ACCESS_W;
      const rightW = W - rightX;
      const openH = ACCESS_TOP - ACCESS_BOT;
      box(frontGroup, FOOT, FRONT_Y, 0, INTERNAL_W, FOOT, ACCESS_BOT, 0x3498db, 0.88, 2);
      box(frontGroup, FOOT, FRONT_Y, ACCESS_BOT, leftW, FOOT, openH, 0x2980b9, 0.92, 2);
      box(frontGroup, rightX, FRONT_Y, ACCESS_BOT, rightW, FOOT, openH, 0x2980b9, 0.92, 2);
      box(frontGroup, FOOT, FRONT_Y, ACCESS_TOP, INTERNAL_W, FOOT, H - ACCESS_TOP, 0x3498db, 0.88, 2);

      const ox0 = ACCESS_X * S, ox1 = (ACCESS_X + ACCESS_W) * S;
      const oz0 = ACCESS_BOT * S, oz1 = ACCESS_TOP * S;
      const oy = (FRONT_Y + FOOT * 0.5) * S;
      const openLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(ox0, oz0, oy),
          new THREE.Vector3(ox1, oz0, oy),
          new THREE.Vector3(ox1, oz1, oy),
          new THREE.Vector3(ox0, oz1, oy),
          new THREE.Vector3(ox0, oz0, oy),
        ]),
        new THREE.LineBasicMaterial({ color: 0xff2222 })
      );
      openLine.renderOrder = 3;
      root.add(openLine);
      return { root, frontGroup, footGroup };
    }

    const S = DIM.S, W = DIM.W, D = DIM.D, H = DIM.H;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4f5f7);

    const persp = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 50);
    const ortho = new THREE.OrthographicCamera(-2, 2, 2, -2, 0.05, 50);
    let camera = persp;

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.getElementById("canvas-wrap").appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxDistance = 12;
    controls.minDistance = 0.5;

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dir = new THREE.DirectionalLight(0xffffff, 0.75);
    dir.position.set(-2, 4, 3);
    scene.add(dir);
    const fill = new THREE.DirectionalLight(0xffffff, 0.35);
    fill.position.set(2, 2, -1);
    scene.add(fill);

    const { root, frontGroup, footGroup } = buildCabinBed();
    scene.add(root);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(4, 4),
      new THREE.MeshBasicMaterial({ color: 0xe8eaed, transparent: true, opacity: 0.5 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(W * S * 0.5, -0.001, D * S * 0.5);
    scene.add(ground);

    function useOrtho(spanX, spanY, mirrorX = false) {
      camera = ortho;
      controls.object = ortho;
      controls.enabled = false;
      const aspect = innerWidth / innerHeight;
      let halfW = spanX / 2, halfH = spanY / 2;
      if (halfW / halfH > aspect) halfH = halfW / aspect;
      else halfW = halfH * aspect;
      const pad = 1.08;
      ortho.left = mirrorX ? halfW * pad : -halfW * pad;
      ortho.right = mirrorX ? -halfW * pad : halfW * pad;
      ortho.top = halfH * pad;
      ortho.bottom = -halfH * pad;
      ortho.near = 0.1;
      ortho.far = 20;
      ortho.updateProjectionMatrix();
    }

    const views = {
      "3d": () => {
        camera = persp;
        controls.object = persp;
        controls.enabled = true;
        controls.enableRotate = true;
        controls.enableDamping = true;
        footGroup.visible = true;
        frontGroup.visible = true;
        persp.position.set(-2.4, 2.8, 2.8);
        controls.target.set(W * S * 0.55, H * S * 0.35, D * S * 0.4);
        persp.up.set(0, 1, 0);
        controls.update();
      },
      front: () => {
        footGroup.visible = true;
        frontGroup.visible = true;
        useOrtho(W * S, H * S, false);
        ortho.position.set(W * S * 0.5, H * S * 0.5, D * S + 4);
        ortho.up.set(0, 1, 0);
        ortho.lookAt(W * S * 0.5, H * S * 0.5, 0);
        ortho.updateMatrixWorld(true);
      },
      top: () => {
        footGroup.visible = true;
        frontGroup.visible = true;
        useOrtho(W * S, D * S, false);
        ortho.position.set(W * S * 0.5, H * S + 4, D * S * 0.5);
        ortho.up.set(0, 0, -1);
        ortho.lookAt(W * S * 0.5, 0, D * S * 0.5);
        ortho.updateMatrixWorld(true);
      },
      side: () => {
        footGroup.visible = false;
        frontGroup.visible = true;
        useOrtho(D * S, H * S, true);
        ortho.position.set(DIM.FOOT * S + 0.05, H * S * 0.5, D * S * 0.5);
        ortho.up.set(0, 1, 0);
        ortho.lookAt(W * S * 0.5, H * S * 0.5, D * S * 0.5);
        ortho.updateMatrixWorld(true);
      },
    };

    let currentView = "3d";
    const label = document.getElementById("view-label");
    const viewNames = { "3d": "3D", front: "Front elevation", top: "Top plan", side: "Side elevation (from foot)" };

    function setView(name) {
      if (!views[name]) return false;
      footGroup.visible = true;
      frontGroup.visible = true;
      currentView = name;
      views[name]();
      label.textContent = "View: " + viewNames[name];
      document.querySelectorAll("[data-view]").forEach((b) => {
        b.classList.toggle("active", b.dataset.view === name);
      });
      renderer.render(scene, camera);
      return true;
    }

    document.querySelectorAll("[data-view]").forEach((btn) => {
      btn.addEventListener("click", () => setView(btn.dataset.view));
    });
    document.getElementById("reset").onclick = () => setView(currentView);
    document.getElementById("toggleFront").onclick = () => {
      frontGroup.visible = !frontGroup.visible;
      renderer.render(scene, camera);
    };
    addEventListener("resize", () => {
      persp.aspect = innerWidth / innerHeight;
      persp.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      setView(currentView);
    });

    window.__cabinBed = {
      ready: false, DIM, setView,
      getView: () => currentView,
      render: () => renderer.render(scene, camera),
      canvas: () => renderer.domElement,
    };

    setView("3d");
    window.__cabinBed.ready = true;
    document.title = "Cabin Bed 3D — READY";

    (function animate() {
      requestAnimationFrame(animate);
      if (currentView === "3d" && controls.enabled) controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
