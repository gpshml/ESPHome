<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cabin Bed — Interactive 3D</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a1d23; color: #e8eaed; font-family: system-ui, sans-serif; overflow: hidden; }
    #ui {
      position: absolute; z-index: 10; top: 12px; left: 12px; right: 12px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      pointer-events: none;
    }
    #ui > * { pointer-events: auto; }
    h1 { font-size: 15px; font-weight: 600; margin: 0; background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 8px; }
    .hint { font-size: 12px; background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 8px; color: #b0b8c4; }
    button {
      background: #2980b9; color: #fff; border: 0; border-radius: 8px;
      padding: 8px 12px; font-size: 13px; cursor: pointer; font-weight: 600;
    }
    button.secondary { background: #3d4450; }
    #canvas-wrap { width: 100%; height: 100%; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="ui">
    <h1>Cabin bed — interactive 3D</h1>
    <span class="hint">Left-drag: rotate · Right-drag / two-finger: pan · Scroll: zoom</span>
    <button type="button" id="reset">Reset view</button>
    <button type="button" class="secondary" id="toggleFront">Toggle front wall</button>
  </div>
  <div id="canvas-wrap"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // Locked mm dimensions
    const FOOT = 98, INTERNAL_W = 2246, W = INTERNAL_W + FOOT; // 2344
    const D = 1242, EXT = 237, H = 2380;
    const REAR = 210, HEAD_W = 326, SHELF = 1200;
    const PLINTH = 173, FRAME_H = 357, PLATFORM = PLINTH + FRAME_H; // 530
    const MATT_W = 1900, MATT_D = 900, MATT_H = 220, TOL = 10;
    const FRAME_D = MATT_D + TOL * 2; // 920
    const ACCESS_W = 1300, ACCESS_X = 300 + FOOT, ACCESS_BOT = 640, ACCESS_TOP = 2080;
    const FRONT_Y = D - FOOT; // 1144

    // Scale mm → scene units
    const S = 0.001;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1d23);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 50);
    // Look into alcove: foot left, head right, back far
    camera.position.set(-1.8, 2.4, 1.6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = false;
    document.getElementById("canvas-wrap").appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(W * S * 0.45, H * S * 0.35, D * S * 0.45);
    controls.enableDamping = true;
    controls.maxDistance = 12;
    controls.minDistance = 0.8;
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const dir = new THREE.DirectionalLight(0xffffff, 0.85);
    dir.position.set(-2, 4, 3);
    scene.add(dir);

    const root = new THREE.Group();
    scene.add(root);

    function box(x, y, z, w, d, h, color, opacity = 1) {
      // y = height in Three.js; our Z is height, our Y is depth
      // Map: X→X, depth Y→Z, height Z→Y
      const geo = new THREE.BoxGeometry(w * S, h * S, d * S);
      const mat = new THREE.MeshStandardMaterial({
        color,
        transparent: opacity < 1,
        opacity,
        depthWrite: opacity >= 0.95,
        metalness: 0.05,
        roughness: 0.75,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(
        (x + w / 2) * S,
        (z + h / 2) * S,
        (y + d / 2) * S
      );
      // Edge outline for clarity
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.35 })
      );
      mesh.add(edges);
      root.add(mesh);
      return mesh;
    }

    // Foot wall + extension
    box(0, 0, 0, FOOT, D - EXT, H, 0xe67e22, 0.92);
    box(0, D - EXT, 0, FOOT, EXT, H, 0xf1c40f, 0.95);

    // Rear shelf
    box(FOOT, 0, 0, INTERNAL_W, REAR, SHELF, 0xd4b896, 0.85);

    // Head wall to front plane
    box(W - HEAD_W, 0, 0, HEAD_W, FRONT_Y, SHELF, 0xbdc3c7, 0.8);

    // Above shelf (ghost)
    box(FOOT, 0, SHELF, INTERNAL_W, D, H - SHELF, 0xecf0f1, 0.12);

    // Bed
    const mx = FOOT + TOL, fy = REAR, my = REAR + TOL;
    box(mx, fy, 0, MATT_W, FRAME_D, PLINTH, 0xc4a574, 0.95);
    box(mx, fy, PLINTH, MATT_W, FRAME_D, FRAME_H, 0x8B4513, 0.95);
    box(mx, my, PLATFORM, MATT_W, MATT_D, MATT_H, 0x2ecc71, 0.98);

    // Front fascia — drawn after bed; higher opacity + depthWrite for correct layering
    const frontGroup = new THREE.Group();
    root.add(frontGroup);
    function frontBox(x, y, z, w, d, h, color, opacity = 0.88) {
      const geo = new THREE.BoxGeometry(w * S, h * S, d * S);
      const mat = new THREE.MeshStandardMaterial({
        color, transparent: true, opacity, depthWrite: true, roughness: 0.6,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set((x + w / 2) * S, (z + h / 2) * S, (y + d / 2) * S);
      mesh.renderOrder = 2;
      frontGroup.add(mesh);
      return mesh;
    }
    const leftW = ACCESS_X - FOOT;
    const rightX = ACCESS_X + ACCESS_W;
    const rightW = W - rightX;
    frontBox(FOOT, FRONT_Y, 0, leftW, FOOT, ACCESS_TOP, 0x2980b9, 0.9);
    frontBox(rightX, FRONT_Y, 0, rightW, FOOT, ACCESS_TOP, 0x2980b9, 0.9);
    frontBox(FOOT, FRONT_Y, 0, INTERNAL_W, FOOT, ACCESS_BOT, 0x3498db, 0.85);
    frontBox(FOOT, FRONT_Y, ACCESS_TOP, INTERNAL_W, FOOT, H - ACCESS_TOP, 0x3498db, 0.85);

    // Access opening outline
    const ox0 = ACCESS_X * S, ox1 = (ACCESS_X + ACCESS_W) * S;
    const oz0 = ACCESS_BOT * S, oz1 = ACCESS_TOP * S;
    const oy = (FRONT_Y + FOOT * 0.5) * S;
    const pts = [
      new THREE.Vector3(ox0, oz0, oy),
      new THREE.Vector3(ox1, oz0, oy),
      new THREE.Vector3(ox1, oz1, oy),
      new THREE.Vector3(ox0, oz1, oy),
      new THREE.Vector3(ox0, oz0, oy),
    ];
    const openLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: 0xff2222, linewidth: 2 })
    );
    openLine.renderOrder = 3;
    root.add(openLine);

    // Floor grid helper at origin corner
    const grid = new THREE.GridHelper(3, 12, 0x444b58, 0x2a3038);
    grid.position.set(W * S * 0.5, 0, D * S * 0.5);
    scene.add(grid);

    const homePos = camera.position.clone();
    const homeTarget = controls.target.clone();
    document.getElementById("reset").onclick = () => {
      camera.position.copy(homePos);
      controls.target.copy(homeTarget);
      controls.update();
    };
    document.getElementById("toggleFront").onclick = () => {
      frontGroup.visible = !frontGroup.visible;
    };

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
