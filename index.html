<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cabin Bed — Component 3D</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f5f7; color: #1a1d23; font-family: system-ui, sans-serif; overflow: hidden; }
    #ui {
      position: absolute; z-index: 10; top: 12px; left: 12px; right: 12px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      pointer-events: none;
    }
    #ui > * { pointer-events: auto; }
    h1 { font-size: 15px; font-weight: 600; margin: 0; background: rgba(255,255,255,.9); padding: 8px 12px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .hint { font-size: 12px; background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 8px; color: #5a6270; }
    button {
      background: #2980b9; color: #fff; border: 0; border-radius: 8px;
      padding: 8px 12px; font-size: 13px; cursor: pointer; font-weight: 600;
    }
    button.secondary { background: #5a6270; }
    button.active { outline: 2px solid #1a1d23; outline-offset: 1px; }
    #legend {
      position: absolute; z-index: 10; bottom: 14px; right: 14px;
      background: rgba(255,255,255,.94); padding: 10px 12px; border-radius: 8px;
      font-size: 11px; line-height: 1.55; box-shadow: 0 1px 3px rgba(0,0,0,.12); max-width: 220px;
    }
    #legend b { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:middle; }
    #canvas-wrap { width: 100%; height: 100%; }
    canvas { display: block; }
    #view-label {
      position: absolute; bottom: 14px; left: 14px; z-index: 10;
      background: rgba(255,255,255,.92); padding: 8px 12px; border-radius: 8px;
      font-size: 13px; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }
    #err {
      display: none; position: absolute; inset: 20% 10%; z-index: 20;
      background: #fff3cd; border: 1px solid #ffc107; border-radius: 10px;
      padding: 20px; font-size: 14px; line-height: 1.5;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="ui">
    <h1>Cabin bed — component assembly</h1>
    <span class="hint">Studs · track · ledgers · PB · lift · bed · Left-drag rotate</span>
    <button type="button" class="secondary" data-view="3d">3D</button>
    <button type="button" class="secondary" data-view="front">Front</button>
    <button type="button" class="secondary" data-view="top">Top</button>
    <button type="button" class="secondary" data-view="side">Side (foot)</button>
    <button type="button" id="reset">Reset</button>
    <button type="button" class="secondary" id="toggleFront">Toggle front</button>
  </div>
  <div id="view-label">View: 3D</div>
  <div id="legend">
    <div><b style="background:#95a5a6"></b>C-stud / track</div>
    <div><b style="background:#ecf0f1;border:1px solid #bbb"></b>Plasterboard face</div>
    <div><b style="background:#c4a574"></b>Wall ledger</div>
    <div><b style="background:#d4b896"></b>Shelf deck</div>
    <div><b style="background:#b8956a"></b>170mm lift</div>
    <div><b style="background:#8B4513"></b>Existing bed</div>
    <div><b style="background:#2ecc71"></b>Mattress</div>
    <div><b style="background:#e67e22"></b>Existing foot (ghost)</div>
  </div>
  <div id="err"></div>
  <div id="canvas-wrap"></div>

  <script type="module">
    const errEl = document.getElementById("err");
    function showError(msg) {
      errEl.style.display = "block";
      errEl.innerHTML = "<strong>Could not load 3D viewer</strong><br>" + msg +
        "<br><br>Needs network for Three.js, or: <code>python3 -m http.server 8877</code>";
      console.error(msg);
    }

    let THREE, OrbitControls;
    try {
      THREE = await import("three");
      ({ OrbitControls } = await import("three/addons/controls/OrbitControls.js"));
    } catch (e) {
      showError(String(e && e.message ? e.message : e));
      throw e;
    }

/**
 * Cabin bed — component assembly model (mm).
 *
 * Orientation = locked front aspect / top_plan_FINAL.png (LOCKED-IN-SPEC):
 * Looking into the alcove from the room — FOOT LEFT, HEAD RIGHT.
 * Narrow access pier (~300mm) at the FOOT (left); wider pier at the HEAD.
 * Origin = back-left-floor (rear ∩ foot wall ∩ floor).
 *
 * Do NOT invert head/foot for a mirrored 3D viewer — fix the view, not the room.
 */

const DIM = {
  FOOT: 98,
  INTERNAL_W: 2246,
  W: 2246 + 98, // 2344
  D: 1242,
  EXT: 237,
  H: 2380,
  REAR: 210,
  HEAD_W: 326,
  SHELF: 1200,
  PLINTH: 170,
  FRAME_H: 360,
  PLATFORM: 170 + 360, // 530
  MATT_W: 1900,
  MATT_D: 900,
  MATT_H: 220,
  TOL: 10,
  FRAME_D: 900 + 20, // 920
  ACCESS_W: 1300,
  FOOT_PIER: 300,
  // Opening set out from foot: narrow pier at left
  get ACCESS_X() { return this.FOOT + this.FOOT_PIER; }, // 398
  ACCESS_BOT: 640,
  ACCESS_TOP: 2080,
  STUD_W: 70,
  STUD_FL: 45,
  TRACK_LEG: 25,
  PB: 12.5,
  LEDGER: 70,
  DECK_T: 18,
  LEDGER_H: 45,
  NOGGIN_ZS: [600, 1200, 1800],
  get FRONT_Y() { return this.D - this.FOOT; }, // 1144
  get FRONT_ROOM_Y() { return this.D; },
  get BED_BAY() { return this.FRONT_Y - this.REAR; },
  get FRAME_TUCK() { return (this.BED_BAY - this.FRAME_D) / 2; },
  get ledger_z() { return this.SHELF - this.DECK_T - this.LEDGER_H; },
  get fascia_h() { return this.SHELF - this.DECK_T; },
  S: 0.001,
};

const COL = {
  existing: 0x8c6b47,
  footExt: 0x6b783f,
  stud: 0x9ea39a,
  track: 0x8c9189,
  noggin: 0x7f8680,
  pb: 0x5c663d, // autumnal olive
  ledger: 0x9e7347,
  deck: 0xb89461,
  riser: 0x9e7347,
  bed: 0x664222,
  matt: 0xc7bda6,
  ghost: 0xbdc3c7,
  drawer: 0x73614d,
  open: 0xff2222,
};

/**
 * Build component assembly.
 * Model X→Three X, depth Y→Three Z, height Z→Three Y.
 */
function buildCabinBed(THREE) {
  const {
    FOOT, INTERNAL_W, W, D, EXT, H, REAR, HEAD_W, SHELF,
    PLINTH, FRAME_H, PLATFORM, MATT_W, MATT_D, MATT_H, TOL, FRAME_D,
    ACCESS_W, ACCESS_BOT, ACCESS_TOP,
    STUD_W, STUD_FL, TRACK_LEG, PB, LEDGER, S,
  } = DIM;
  const FRONT_Y = DIM.FRONT_Y;
  const ACCESS_X = DIM.ACCESS_X;
  const shelfW = INTERNAL_W - HEAD_W;
  const frameTuck = DIM.FRAME_TUCK;
  const nogginZs = DIM.NOGGIN_ZS;
  const ledgerZ = DIM.ledger_z;
  const fasciaH = DIM.fascia_h;
  const deckT = DIM.DECK_T;

  const root = new THREE.Group();
  const frontGroup = new THREE.Group();
  const footGroup = new THREE.Group();
  const headGroup = new THREE.Group();
  const rearGroup = new THREE.Group();
  root.add(frontGroup, footGroup, headGroup, rearGroup);

  function box(parent, x, y, z, w, d, h, color, opacity = 1, renderOrder = 0, metalness = 0.05) {
    const geo = new THREE.BoxGeometry(w * S, h * S, d * S);
    const mat = new THREE.MeshStandardMaterial({
      color,
      transparent: opacity < 1,
      opacity,
      depthWrite: opacity >= 0.85,
      metalness,
      roughness: metalness > 0.3 ? 0.35 : 0.75,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set((x + w / 2) * S, (z + h / 2) * S, (y + d / 2) * S);
    mesh.renderOrder = renderOrder;
    mesh.add(new THREE.LineSegments(
      new THREE.EdgesGeometry(geo),
      new THREE.LineBasicMaterial({ color: 0x222222, transparent: true, opacity: 0.35 })
    ));
    parent.add(mesh);
    return mesh;
  }

  function nogginsBetween(parent, xL, xR, y, zs, thick = STUD_FL) {
    const span = xR - xL;
    if (span < 20) return;
    for (const z of zs) {
      box(parent, xL, y, z - thick / 2, span, STUD_FL, thick, COL.noggin, 1, 1, 0.55);
    }
  }

  // —— Existing structure ——
  // Foot wall LEFT (0..FOOT), head wall RIGHT ghost, back wall
  box(footGroup, 0, 0, 0, FOOT, D - EXT, H, COL.existing, 0.35);
  box(root, FOOT, -20, 0, INTERNAL_W, 20, H, COL.ghost, 0.18);
  box(headGroup, W, 0, 0, 20, FRONT_Y, H, COL.ghost, 0.18);

  // —— Foot extension +237mm at FRONT — LEFT (0..FOOT), flush rules ——
  {
    const y0 = D - EXT;
    const studX = PB;
    box(footGroup, studX, y0 + 40, 0, STUD_W, STUD_FL, H, COL.stud, 1, 1, 0.55);
    box(footGroup, studX, D - STUD_FL - 40, 0, STUD_W, STUD_FL, H, COL.stud, 1, 1, 0.55);
    box(footGroup, (FOOT - 72) / 2, y0, 0, 72, EXT, TRACK_LEG, COL.track, 1, 1, 0.55);
    box(footGroup, (FOOT - 72) / 2, y0, H - TRACK_LEG, 72, EXT, TRACK_LEG, COL.track, 1, 1, 0.55);
    const yA = y0 + 40 + STUD_FL;
    const yB = D - STUD_FL - 40;
    for (const z of nogginZs) {
      box(footGroup, studX, yA, z - 20, STUD_W, yB - yA, 40, COL.noggin, 1, 1, 0.55);
    }
    box(footGroup, 0, y0, 0, PB, EXT, H, COL.pb, 0.98, 2);
    box(footGroup, FOOT - PB, y0, 0, PB, EXT, H, COL.pb, 0.98, 2);
    box(footGroup, 0, D - PB, 0, FOOT, PB, H, COL.pb, 0.98, 2);
    box(footGroup, 0, y0, 0, FOOT, EXT, H, COL.footExt, 0.06);
  }

  // —— Rear shelf (stops before head) ——
  {
    const g = rearGroup;
    const sx = FOOT;
    box(g, sx, 0, ledgerZ, shelfW, LEDGER, DIM.LEDGER_H, COL.ledger, 1, 1);
    box(g, sx, 0, SHELF - deckT, shelfW, REAR, deckT, COL.deck, 1, 2);
    const fasciaY = REAR - STUD_FL;
    const uprightXs = [sx + 30, sx + shelfW / 2 - STUD_W / 2, sx + shelfW - STUD_W - 30];
    for (const x of uprightXs) {
      box(g, x, fasciaY, 0, STUD_W, STUD_FL, fasciaH, COL.stud, 1, 1, 0.55);
    }
    for (let i = 0; i < uprightXs.length - 1; i++) {
      nogginsBetween(g, uprightXs[i] + STUD_W, uprightXs[i + 1], fasciaY, [400, 800], 40);
    }
    box(g, sx, fasciaY, fasciaH - TRACK_LEG, shelfW, STUD_FL, TRACK_LEG, COL.track, 1, 1, 0.55);
    box(g, sx, REAR, 0, shelfW, PB, fasciaH, COL.pb, 0.98, 2);
    box(g, sx + shelfW / 2 - 150, 0, 935, 300, 40, 80, COL.ledger, 1, 1);
  }

  // —— Head shelf/fascia RIGHT ——
  {
    const g = headGroup;
    const hx = W - HEAD_W;
    box(g, W - LEDGER, 0, ledgerZ, LEDGER, FRONT_Y, DIM.LEDGER_H, COL.ledger, 1, 1);
    box(g, hx, 0, SHELF - deckT, HEAD_W, FRONT_Y, deckT, COL.deck, 1, 2);
    const ys = [REAR + 40, FRONT_Y / 2 - STUD_W / 2, FRONT_Y - STUD_W - 40];
    for (const y of ys) {
      box(g, hx, y, 0, STUD_FL, STUD_W, fasciaH, COL.stud, 1, 1, 0.55);
    }
    for (let i = 0; i < ys.length - 1; i++) {
      const y0 = ys[i] + STUD_W;
      const span = ys[i + 1] - y0;
      if (span > 20) {
        for (const z of [400, 800]) {
          box(g, hx, y0, z - 20, STUD_FL, span, 40, COL.noggin, 1, 1, 0.55);
        }
      }
    }
    // Bed face — exposed bay only (not hidden back to rear wall)
    box(g, hx - PB, REAR, 0, PB, FRONT_Y - REAR, fasciaH, COL.pb, 0.98, 2);
    box(g, hx, FRONT_Y, 0, HEAD_W, PB, fasciaH, COL.pb, 0.98, 2);
  }

  // —— Bed (pillow toward HEAD / right) ——
  {
    const mx = FOOT + TOL;
    const fy = REAR + frameTuck;
    const my = fy + TOL;
    const rw = 45;
    const gap = (MATT_W - 3 * rw) / 2;
    for (let i = 0; i < 3; i++) {
      box(root, mx + i * (rw + gap), fy, 0, rw, FRAME_D, PLINTH, COL.riser, 1, 1);
    }
    box(root, mx, fy + 80, 0, MATT_W, 45, PLINTH, COL.riser, 1, 1);
    box(root, mx, fy + FRAME_D - 125, 0, MATT_W, 45, PLINTH, COL.riser, 1, 1);
    box(root, mx, fy, PLINTH, MATT_W, FRAME_D, FRAME_H, COL.bed, 0.95, 1);
    box(root, mx, my, PLATFORM, MATT_W, MATT_D, MATT_H, COL.matt, 0.98, 2);
    const dw = (MATT_W - 50) / 2;
    box(root, mx + 15, fy + 50, 25, dw, FRAME_D - 100, PLINTH - 45, COL.drawer, 0.4, 1);
    box(root, mx + dw + 35, fy + 50, 25, dw, FRAME_D - 100, PLINTH - 45, COL.drawer, 0.4, 1);
  }

  // —— Front fascia: X=FOOT..W; narrow pier at FOOT (left) ——
  {
    const g = frontGroup;
    const leftW = ACCESS_X - FOOT; // 300 at foot
    const rightX = ACCESS_X + ACCESS_W;
    const rightW = W - rightX; // ~646 at head
    const y = FRONT_Y;
    const ty = y + (FOOT - 72) / 2;
    const sy = y + (FOOT - STUD_FL) / 2;
    const roomY = y + FOOT - PB;
    const alcoveY = y;

    box(g, FOOT, ty, 0, INTERNAL_W, 72, TRACK_LEG, COL.track, 1, 1, 0.55);
    box(g, FOOT, ty, H - TRACK_LEG, INTERNAL_W, 72, TRACK_LEG, COL.track, 1, 1, 0.55);
    box(g, FOOT, ty, ACCESS_BOT - TRACK_LEG, INTERNAL_W, 72, TRACK_LEG, COL.track, 1, 1, 0.55);
    box(g, FOOT, ty, ACCESS_TOP, INTERNAL_W, 72, TRACK_LEG, COL.track, 1, 1, 0.55);

    const leftStuds = [FOOT + 25, ACCESS_X - STUD_W - 25];
    const rightStuds = [rightX + 25, W - STUD_W - 25];
    for (const x of leftStuds) box(g, x, sy, 0, STUD_W, STUD_FL, H, COL.stud, 1, 1, 0.55);
    for (const x of rightStuds) box(g, x, sy, 0, STUD_W, STUD_FL, H, COL.stud, 1, 1, 0.55);

    nogginsBetween(g, leftStuds[0] + STUD_W, leftStuds[1], sy, nogginZs);
    nogginsBetween(g, rightStuds[0] + STUD_W, rightStuds[1], sy, nogginZs);
    nogginsBetween(g, leftStuds[0] + STUD_W, leftStuds[1], sy, [320, 2230], 40);
    nogginsBetween(g, rightStuds[0] + STUD_W, rightStuds[1], sy, [320, 2230], 40);

    for (const pbY of [roomY, alcoveY]) {
      box(g, FOOT, pbY, 0, INTERNAL_W, PB, ACCESS_BOT, COL.pb, 0.98, 2);
      box(g, FOOT, pbY, ACCESS_BOT, leftW, PB, ACCESS_TOP - ACCESS_BOT, COL.pb, 0.98, 2);
      box(g, rightX, pbY, ACCESS_BOT, rightW, PB, ACCESS_TOP - ACCESS_BOT, COL.pb, 0.98, 2);
      box(g, FOOT, pbY, ACCESS_TOP, INTERNAL_W, PB, H - ACCESS_TOP, COL.pb, 0.98, 2);
    }

    const oh = ACCESS_TOP - ACCESS_BOT;
    box(g, ACCESS_X - PB, y, ACCESS_BOT, PB, FOOT, oh, COL.pb, 0.98, 2);
    box(g, rightX, y, ACCESS_BOT, PB, FOOT, oh, COL.pb, 0.98, 2);
    box(g, ACCESS_X, y, ACCESS_BOT - PB, ACCESS_W, FOOT, PB, COL.pb, 0.98, 2);
    box(g, ACCESS_X, y, ACCESS_TOP, ACCESS_W, FOOT, PB, COL.pb, 0.98, 2);

    const ox0 = ACCESS_X * S, ox1 = (ACCESS_X + ACCESS_W) * S;
    const oz0 = ACCESS_BOT * S, oz1 = ACCESS_TOP * S;
    const oy = (y + FOOT * 0.5) * S;
    const openLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(ox0, oz0, oy),
        new THREE.Vector3(ox1, oz0, oy),
        new THREE.Vector3(ox1, oz1, oy),
        new THREE.Vector3(ox0, oz1, oy),
        new THREE.Vector3(ox0, oz0, oy),
      ]),
      new THREE.LineBasicMaterial({ color: COL.open })
    );
    openLine.renderOrder = 4;
    root.add(openLine);
  }

  return { root, frontGroup, footGroup, headGroup, rearGroup, DIM, COL };
}


    function buildCabinBedLocal() {
      return buildCabinBed(THREE);
    }

    const S = DIM.S, W = DIM.W, D = DIM.D, H = DIM.H;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4f5f7);

    const persp = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 50);
    const ortho = new THREE.OrthographicCamera(-2, 2, 2, -2, 0.05, 50);
    let camera = persp;

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.getElementById("canvas-wrap").appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxDistance = 12;
    controls.minDistance = 0.5;

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(-2, 4, 3);
    scene.add(dir);
    const fill = new THREE.DirectionalLight(0xffffff, 0.35);
    fill.position.set(2, 2, -1);
    scene.add(fill);

    const { root, frontGroup, footGroup, headGroup } = buildCabinBedLocal();
    scene.add(root);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(4, 4),
      new THREE.MeshBasicMaterial({ color: 0xe8eaed, transparent: true, opacity: 0.5 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(W * S * 0.5, -0.001, D * S * 0.5);
    scene.add(ground);

    function useOrtho(spanX, spanY, mirrorX = false) {
      camera = ortho;
      controls.object = ortho;
      controls.enabled = false;
      const aspect = innerWidth / innerHeight;
      let halfW = spanX / 2, halfH = spanY / 2;
      if (halfW / halfH > aspect) halfH = halfW / aspect;
      else halfW = halfH * aspect;
      const pad = 1.08;
      ortho.left = mirrorX ? halfW * pad : -halfW * pad;
      ortho.right = mirrorX ? -halfW * pad : halfW * pad;
      ortho.top = halfH * pad;
      ortho.bottom = -halfH * pad;
      ortho.near = 0.1;
      ortho.far = 20;
      ortho.updateProjectionMatrix();
    }

    const views = {
      "3d": () => {
        camera = persp;
        controls.object = persp;
        controls.enabled = true;
        controls.enableRotate = true;
        controls.enableDamping = true;
        footGroup.visible = true;
        headGroup.visible = true;
        frontGroup.visible = true;
        persp.position.set(-2.4, 2.8, 2.8);
        controls.target.set(W * S * 0.55, H * S * 0.35, D * S * 0.4);
        persp.up.set(0, 1, 0);
        controls.update();
      },
      front: () => {
        footGroup.visible = true;
        headGroup.visible = true;
        frontGroup.visible = true;
        useOrtho(W * S, H * S, false);
        ortho.position.set(W * S * 0.5, H * S * 0.5, D * S + 4);
        ortho.up.set(0, 1, 0);
        ortho.lookAt(W * S * 0.5, H * S * 0.5, 0);
        ortho.updateMatrixWorld(true);
      },
      top: () => {
        footGroup.visible = true;
        headGroup.visible = true;
        frontGroup.visible = true;
        useOrtho(W * S, D * S, false);
        ortho.position.set(W * S * 0.5, H * S + 4, D * S * 0.5);
        ortho.up.set(0, 0, -1);
        ortho.lookAt(W * S * 0.5, 0, D * S * 0.5);
        ortho.updateMatrixWorld(true);
      },
      side: () => {
        footGroup.visible = false;
        headGroup.visible = false;
        frontGroup.visible = true;
        useOrtho(D * S, H * S, false);
        ortho.position.set((DIM.FOOT + DIM.MATT_W * 0.5) * S, H * S * 0.5, D * S * 0.5);
        ortho.up.set(0, 1, 0);
        ortho.lookAt(W * S * 0.5, H * S * 0.5, D * S * 0.5);
        ortho.updateMatrixWorld(true);
      },
    };

    let currentView = "3d";
    const label = document.getElementById("view-label");
    const viewNames = {
      "3d": "3D assembly — components",
      front: "Front elevation",
      top: "Top plan",
      side: "Side section (from foot)",
    };

    function setView(name) {
      if (!views[name]) return false;
      footGroup.visible = true;
      headGroup.visible = true;
      frontGroup.visible = true;
      currentView = name;
      views[name]();
      label.textContent = "View: " + viewNames[name];
      document.querySelectorAll("[data-view]").forEach((b) => {
        b.classList.toggle("active", b.dataset.view === name);
      });
      renderer.render(scene, camera);
      return true;
    }

    document.querySelectorAll("[data-view]").forEach((btn) => {
      btn.addEventListener("click", () => setView(btn.dataset.view));
    });
    document.getElementById("reset").onclick = () => setView(currentView);
    document.getElementById("toggleFront").onclick = () => {
      frontGroup.visible = !frontGroup.visible;
      renderer.render(scene, camera);
    };
    addEventListener("resize", () => {
      persp.aspect = innerWidth / innerHeight;
      persp.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      setView(currentView);
    });

    window.__cabinBed = {
      ready: false, DIM, setView,
      getView: () => currentView,
      render: () => renderer.render(scene, camera),
      canvas: () => renderer.domElement,
    };

    setView("3d");
    window.__cabinBed.ready = true;
    document.title = "Cabin Bed 3D — READY";

    (function animate() {
      requestAnimationFrame(animate);
      if (currentView === "3d" && controls.enabled) controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
